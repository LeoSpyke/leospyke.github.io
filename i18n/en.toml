[consulting_grapheneos_description]
other = "Device setup, privacy and security configuration, app and service choices, backups, and everyday usage guidance."

[consulting_grapheneos_detail]
other = "Get help choosing a compatible device and completing installation and initial setup. Configure profiles, permissions, updates, backups, and apps for your needs, with practical everyday guidance and clear compatibility trade-offs."

