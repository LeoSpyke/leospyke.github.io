other = "Take back control of your digital life: less dependence on Big Tech, less profiling and surveillance, including by governments or malicious actors. I help you choose and configure open-source tools; Proxmox and GrapheneOS are practical examples."

[consulting_proxmox_title]
other = "Proxmox"

[consulting_proxmox_description]
other = "Virtualization, clusters, storage, networking, backup strategy, and homelab or small-business deployments."

[consulting_proxmox_detail]
other = "I design and configure Proxmox hosts, virtual machines and containers, storage, and networking. Get help planning backups and recovery, migrating services, and managing the environment independently, from a homelab to a small business setup."

[consulting_aws_title]
other = "AWS"

[consulting_aws_description]
other = "AWS architecture and infrastructure as code, with GitLab DevOps workflows, CI/CD pipelines, deployment automation, security fundamentals, and cost optimization."

[consulting_aws_detail]
other = "From AWS architecture to production: infrastructure as code, GitLab repositories and CI/CD pipelines, automated testing and deployments. Review access, secrets, baseline security, and costs to make releases repeatable and maintainable."

[consulting_ai_title]
other = "AI & automation"

[consulting_ai_description]
other = "Practical AI integrations, local models, workflow automation, and connecting language models to real tools."

[consulting_ai_detail]
other = "Identify where AI is useful, then integrate local models or AI services into existing workflows. This can include automation, assistants grounded in your data, and connections to existing tools, while considering privacy, cost, and limitations."

[consulting_grapheneos_title]
