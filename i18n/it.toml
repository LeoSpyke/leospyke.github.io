[cloud_heading]
other = "// CLOUD & DEVOPS"

[cloud_intro]
other = "Infrastruttura cloud e pipeline di delivery, dall'architettura ai deployment ripetibili."

[sovereignty_heading]
other = "// SOVRANITÀ DIGITALE"

[sovereignty_intro]
other = "Riprendi il controllo della tua vita digitale: meno dipendenza dalle Big Tech, meno profilazione e sorveglianza, anche da parte di governi o malintenzionati. Ti aiuto a scegliere e configurare strumenti open source; Proxmox e GrapheneOS sono esempi concreti."

[consulting_proxmox_title]
other = "Proxmox"

[consulting_proxmox_description]
other = "Virtualizzazione, cluster, storage, networking, strategie di backup e installazioni per homelab o piccole aziende."

[consulting_proxmox_detail]
other = "Progetto e configuro host Proxmox, macchine virtuali e container, storage e reti. Ti aiuto a pianificare backup e ripristino, migrare servizi e gestire l'ambiente in autonomia, dal homelab a una piccola infrastruttura aziendale."

[consulting_aws_title]
other = "AWS"

[consulting_aws_description]
other = "Architetture AWS e infrastruttura come codice, metodologie DevOps con GitLab, pipeline CI/CD, automazione dei deployment, sicurezza e ottimizzazione dei costi."

[consulting_aws_detail]
other = "Dalla progettazione AWS alla messa in produzione: infrastruttura come codice, repository e pipeline GitLab CI/CD, test e deployment automatizzati. Rivediamo accessi, segreti, sicurezza di base e costi per rendere le release ripetibili e manutenibili."

[consulting_ai_title]
other = "AI e automazione"

[consulting_ai_description]
other = "Integrazioni pratiche di AI, modelli locali, automazione dei flussi e connessione degli LLM a strumenti reali."

[consulting_ai_detail]
other = "Valuto insieme a te se e dove l'AI è utile, poi integro modelli locali o servizi AI nei flussi di lavoro. Posso aiutare con automazioni, assistenti basati sui tuoi dati e collegamenti a strumenti esistenti, tenendo conto di privacy, costi e limiti."

[consulting_grapheneos_title]
other = "GrapheneOS"

[consulting_grapheneos_description]
other = "Configurazione del dispositivo, impostazioni di privacy e sicurezza, scelta di app e servizi, backup e supporto all'uso quotidiano."

[consulting_grapheneos_detail]
other = "Ti accompagno nella scelta di un dispositivo compatibile, installazione e configurazione iniziale. Impostiamo profili, permessi, aggiornamenti, backup e app in base alle tue esigenze, con indicazioni pratiche per l'uso quotidiano e i compromessi di compatibilità."

[consulting_open_source_title]
other = "Ecosistema open source"

[consulting_open_source_description]
other = "Valutazione e adozione di alternative open source per le esigenze digitali quotidiane, con piano di migrazione, configurazione e supporto pratico. Guarda le piattaforme ospitate qui sotto come esempi concreti."

[consulting_open_source_detail]
other = "Partiamo dagli strumenti che usi e da ciò che vuoi proteggere. Individuiamo alternative open source pratiche, pianifichiamo migrazione e gestione dei dati, configuriamo gli strumenti e ti mostro come usarli e mantenerli. Le piattaforme hosted qui sotto sono esempi concreti."

