baseURL = "https://leospyke.dev/"
title = "LeoSpyke's home"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term"]

[languages.en]
locale = "en-US"
label = "English"
title = "LeoSpyke's home"
weight = 1

[languages.en.params]
tagline = "A personal space for notes, projects, and connections."
simplexLabel = "QR code to join the SimpleX server"

[languages.it]
locale = "it-IT"
label = "Italiano"
title = "Lo spazio di LeoSpyke"
weight = 2

[languages.it.params]
tagline = "Uno spazio personale per appunti, progetti e connessioni."
simplexLabel = "QR code per entrare nel server SimpleX"

[permalinks]
posts = "/posts/:year:month:day-:slug"

[markup]
[markup.highlight]
style = "bw"

[caches]
[caches.images]
dir = ":cacheDir/images"

[params]
author = "LeoSpyke"
simplexQR = ""
uptimeKumaURL = ""
uptimeKumaSlug = "default"

# Add social links as repeated params.social entries. Put a QR image in static/ and
# set simplexQR to its site path, for example "/images/simplex.png".
[[params.social]]
name = "GitHub"
handle = "@LeoSpyke"
url = "https://github.com/LeoSpyke"
icon = "github"

[[params.social]]
name = "RSS"
handle = "RSS feed"
url = "/index.xml"
icon = "rss"

[[params.consulting]]
key = "proxmox"

[[params.consulting]]
key = "aws"

[[params.consulting]]
key = "ai"

# Add public hosted services here; monitor must match the public Uptime Kuma monitor name.
# uptimeKumaURL should point to a read-only reverse proxy for the two public status-page APIs,
# with CORS restricted to https://leospyke.dev. No Uptime Kuma API key is needed.
