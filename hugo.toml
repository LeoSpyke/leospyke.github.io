baseURL = "https://leospyke.dev/"
title = "LeoSpyke's home"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term"]

[languages.en]
languageCode = "en-us"
languageName = "English"
title = "LeoSpyke's home"
weight = 1

[languages.en.params]
tagline = "A personal space for notes, projects, and connections."
simplexLabel = "QR code to join the SimpleX server"

[languages.it]
languageCode = "it-it"
languageName = "Italiano"
title = "Lo spazio di LeoSpyke"
weight = 2

[languages.it.params]
tagline = "Uno spazio personale per appunti, progetti e connessioni."
simplexLabel = "QR code per entrare nel server SimpleX"

[permalinks]
posts = "/posts/:year:month:day-:slug"

[markup]
[markup.highlight]
style = "bw"

[caches]
[caches.images]
dir = ":cacheDir/images"

[params]
author = "LeoSpyke"
simplexQR = ""

# Add social links as repeated params.social entries. Put a QR image in static/ and
# set simplexQR to its site path, for example "/images/simplex.png".
[[params.social]]
name = "GitHub"
handle = "@LeoSpyke"
url = "https://github.com/LeoSpyke"
icon = "github"

[[params.social]]
name = "RSS"
handle = "RSS feed"
url = "/index.xml"
icon = "rss"
