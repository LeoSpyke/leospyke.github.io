baseURL = "https://leospyke.dev/"
title = "LeoSpyke's home"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term"]

[languages.en]
locale = "en-US"
label = "English"
title = "LeoSpyke's home"
weight = 2

[languages.en.params]
tagline = "A personal space for notes, projects, and connections."
simplexLabel = "QR code to join the SimpleX server"

[languages.it]
locale = "it-IT"
label = "Italiano"
title = "Lo spazio di LeoSpyke"
weight = 1

[languages.it.params]
tagline = "Uno spazio personale per appunti, progetti e connessioni."
simplexLabel = "QR code per entrare nel server SimpleX"

[permalinks]
posts = "/posts/:year:month:day-:slug"

[markup]
[markup.highlight]
style = "bw"

[caches]
[caches.images]
dir = ":cacheDir/images"

[params]
author = "LeoSpyke"
simplexQR = ""
telegramQR = ""
uptimeKumaURL = ""
uptimeKumaSlug = "default"
telegramURL = ""
# Set telegramURL to your public Telegram profile or channel link.

# Put QR images in static/ and set simplexQR/telegramQR to site paths, for example "/images/simplex.png".
[[params.social]]
name = "GitHub"
handle = "@LeoSpyke"
shortKey = "social_github_short"
url = "https://github.com/LeoSpyke"
icon = "github"

[[params.social]]
name = "RSS"
handle = "RSS feed"
shortKey = "social_rss_short"
url = "/index.xml"
icon = "rss"

[[params.consulting]]
key = "open_source"
category = "sovereignty"

[[params.consulting]]
key = "proxmox"
category = "sovereignty"

[[params.consulting]]
key = "grapheneos"
category = "sovereignty"

[[params.consulting]]
key = "aws"
category = "cloud"

[[params.consulting]]
key = "ai"
category = "cloud"

